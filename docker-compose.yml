# Run on the server with:  docker compose up -d --build
services:
  web:
    build: .
    image: eaglenexa-site:latest
    container_name: eaglenexa-site
    restart: unless-stopped
    environment:
      # The domain Caddy serves and gets a certificate for. Its DNS A record must point at this server.
      DOMAIN: ${DOMAIN:-eaglenexa.ai}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Keeps the HTTPS certificates across restarts and rebuilds (avoids Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
