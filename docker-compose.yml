# Run on the server with:  docker compose up -d --build
# The site listens on 127.0.0.1 only; the existing nginx on the host proxies eaglenexa.ai to it
# (see deploy/nginx-host-eaglenexa.ai.conf).
services:
  web:
    build: .
    image: eaglenexa-site:latest
    container_name: eaglenexa-site
    restart: unless-stopped
    ports:
      # 8092: 8080 is Nextcloud AIO and 8090/8091 are Eagle Coats on this VM. Change SITE_PORT if needed, and match it in the host nginx config.
      - "127.0.0.1:${SITE_PORT:-8092}:80"
