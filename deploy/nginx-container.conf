# nginx inside the container: serves the built site on port 80 (plain HTTP).
# The host's nginx terminates HTTPS for eaglenexa.ai and proxies here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Hashed build files and fonts never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # For the container health check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The page itself always revalidates, so a new deploy shows at once.
    # One-page site: unknown paths fall back to the page.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        try_files $uri $uri/ /index.html;
    }
}
