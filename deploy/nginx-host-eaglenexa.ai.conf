# Site config for the nginx already running on the server (the reverse proxy).
# Copy to /etc/nginx/sites-available/eaglenexa.ai (Ubuntu) or /etc/nginx/conf.d/eaglenexa.ai.conf
# (Oracle Linux), then run:  sudo certbot --nginx -d eaglenexa.ai -d www.eaglenexa.ai
# certbot adds the HTTPS (443) server and the http -> https redirect to this file itself.

# www.eaglenexa.ai -> eaglenexa.ai
server {
    listen 80;
    listen [::]:80;
    server_name www.eaglenexa.ai;
    return 301 $scheme://eaglenexa.ai$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name eaglenexa.ai;

    # The website container (docker-compose.yml publishes it on 127.0.0.1:8080).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
